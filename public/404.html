<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>rphl</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // MIT license — Rafael Pedicini
      //
      // Redirects any unknown URL on GitHub Pages back to index.html with the
      // requested path encoded as a query string, so the SPA router can
      // restore it after boot.
      var pathSegmentsToKeep = 0; // user/org site served at domain root

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
